name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Check out the repository
        uses: actions/checkout@v4

      - name: 🧪 Set up Miniconda
        # GitHub's ubuntu-latest image no longer ships a pre-installed conda
        # ($CONDA is empty), so the action has to install one itself.
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-update-conda: true
          environment-file: environment.yml
          activate-environment: yarp-again

      - name: 📦 Install your local package
        shell: bash -l {0}
        run: |
          pip install -e .

      - name: ✅ Run pytest
        shell: bash -l {0}
        run: |
          pytest test/ -v

